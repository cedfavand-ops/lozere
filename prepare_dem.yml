name: Préparer le MNT (une seule fois)

on:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour enregistrer data/dem_150m_l93.tif dans le dépôt

jobs:
  dem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install numpy scipy rasterio pyproj shapely requests

      - name: Construire le MNT 150 m (Lambert-93)
        run: python prepare_dem.py

      - name: Enregistrer le résultat dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/dem_150m_l93.tif
          git commit -m "MNT 150 m (Lambert-93)" || echo "Rien à enregistrer"
          git push
