name: Lister les stations Infoclimat (une seule fois)

on:
  workflow_dispatch:

permissions:
  contents: write   # enregistre data/stations_infoclimat.json dans le dépôt

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install numpy requests shapely

      - name: Stations situées en Lozère
        run: python list_stations.py

      - name: Enregistrer la liste dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/stations_infoclimat.json
          git commit -m "Stations Infoclimat de Lozère" || echo "Rien à enregistrer"
          git pull --rebase
          git push
