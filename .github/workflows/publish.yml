name: Publier la carte Tn/Tx Lozère

on:
  schedule:
    # Horaire UTC. 16h00 UTC = 18h00 en heure d'été, 17h00 en heure d'hiver.
    # Le run 12Z est complet vers 14h30 UTC ; GitHub peut retarder le déclenchement de quelques minutes.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliothèque ecCodes
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Diagnostic grille ICON (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python archive_icon_ch1.py --check-domain

      - name: Diagnostic disponibilité des runs (lancement manuel uniquement)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python archive_icon_ch1.py --probe

      - name: Construire le site (run 12Z, repli 9Z)
        run: python build_site.py --out site --wait-minutes 30

      - name: Page de démonstration (indice d'inversion forcé à 1)
        continue-on-error: true
        run: python build_site.py --out site/demo --force-alpha 1 --npz "$(ls archive_icon_ch1/*_T_2M.npz | tail -1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
