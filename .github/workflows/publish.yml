name: Publier la carte Tn/Tx Lozère

on:
  schedule:
    # Horaire UTC. 15h20 UTC = 17h20 (été) / 16h20 (hiver) en heure locale.
    # À ajuster selon l'heure à laquelle le run 12Z est complet chez MeteoSwiss.
    - cron: "20 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliothèque ecCodes
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Construire le site (run 12Z)
        run: python build_site.py --out site --wait-minutes 45

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
