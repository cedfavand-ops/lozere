name: Vérifier les prévisions (stations)

on:
  schedule:
    # Chaque soir à 22h00 UTC : les fenêtres de la veille sont terminées (Tx tronquée vers 21h UTC).
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write   # enregistre history/verification.csv dans le dépôt

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      INFOCLIMAT_TOKEN: ${{ secrets.INFOCLIMAT_TOKEN }}
      DATACAKE_TOKENS: ${{ secrets.DATACAKE_TOKENS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install --prefer-binary numpy requests

      - name: Comparer prévisions et observations
        run: python verify.py

      - name: Enregistrer le résultat dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add history/
          git commit -m "Vérification $(date -u +%F)" || echo "Rien à enregistrer"
          git pull --rebase
          git push
